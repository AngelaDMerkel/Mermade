  <text x="475" y="302" fill="#24232A" font-family="Inter, Arial, sans-serif" font-size="102" font-weight="600" letter-spacing="-4">Mermade</text>
  <text x="480" y="365" fill="#7B7883" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="500" letter-spacing="4">VISUAL MERMAID EDITOR</text>
