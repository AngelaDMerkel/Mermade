    <rect x="12" y="144" width="32" height="32" rx="4" fill="#FFFDFA" stroke="#E0095F" stroke-width="6"/>
    <rect x="6" y="14" width="44" height="28" rx="14" fill="#FFFDFA" stroke="#E0095F" stroke-width="6"/>
    <path d="M94 78 112 96 94 114 76 96Z" fill="#FFFDFA" stroke="#E0095F" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="160" cy="28" r="16" fill="#FFFDFA" stroke="#E0095F" stroke-width="6"/>
    <path d="m160 142 18 9v18l-18 9-18-9v-18Z" fill="#FFFDFA" stroke="#E0095F" stroke-width="6" stroke-linejoin="round"/>
